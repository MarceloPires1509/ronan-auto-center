{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ronan Auto Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#2563eb', primary_hover: '#1d4ed8' } } }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center antialiased">
    
    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8 border border-gray-200">
        <div class="flex justify-center mb-6">
            {% if config_global.logo %}
                <img src="{{ config_global.logo.url }}" alt="{{ config_global.nome_loja }}" class="h-24 object-contain">
            {% else %}
                <h1 class="text-primary font-bold text-2xl flex items-center gap-2">
                    <i data-lucide="wrench" class="w-8 h-8"></i>
                    {{ config_global.nome_loja|default:'Ronan Auto Center' }}
                </h1>
            {% endif %}
        </div>
        
        <h2 class="text-center text-xl font-semibold text-gray-800 mb-6">Acesso ao Sistema</h2>

        <form method="POST" action="{% url 'login' %}" class="space-y-5">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="bg-red-50 text-red-600 p-3 rounded-md text-sm text-center">
                E-mail ou senha incorretos. Tente novamente.
            </div>
            {% endif %}

            <div class="space-y-2">
                <label for="username" class="text-sm font-medium text-gray-700">E-mail</label>
                <input type="text" id="username" name="username" required autofocus class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
            </div>

            <div class="space-y-2">
                <label for="password" class="text-sm font-medium text-gray-700">Senha</label>
                <input type="password" id="password" name="password" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
            </div>

            <button type="submit" class="w-full bg-primary text-white py-2 rounded-md font-medium hover:bg-primary_hover transition-colors">
                Entrar
            </button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>

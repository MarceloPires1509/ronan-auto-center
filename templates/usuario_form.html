{% extends 'base.html' %}

{% block header_title %}Novo Usuário{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center gap-4">
        <a href="{% url 'dashboard' %}" class="text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">
            &larr; Voltar
        </a>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Criar Novo Usuário</h1>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-lg border dark:border-gray-700 shadow-sm p-6">
        <form method="POST" action="{% url 'novo_usuario' %}" class="space-y-4">
            {% csrf_token %}
            
            <div class="space-y-2">
                <label for="nome" class="text-sm font-medium text-gray-700 dark:text-gray-300">Nome Completo <span class="text-red-500">*</span></label>
                <input type="text" id="nome" name="nome" required class="w-full px-3 py-2 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary">
            </div>

            <div class="space-y-2">
                <label for="telefone" class="text-sm font-medium text-gray-700 dark:text-gray-300">Telefone <span class="text-red-500">*</span></label>
                <input type="text" id="telefone" name="telefone" required class="w-full px-3 py-2 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary">
            </div>

            <div class="space-y-2">
                <label for="email" class="text-sm font-medium text-gray-700 dark:text-gray-300">E-mail (Login) <span class="text-red-500">*</span></label>
                <input type="email" id="email" name="email" required class="w-full px-3 py-2 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary">
            </div>

            <div class="space-y-2">
                <label for="senha" class="text-sm font-medium text-gray-700 dark:text-gray-300">Senha <span class="text-red-500">*</span></label>
                <input type="password" id="senha" name="senha" required minlength="6" class="w-full px-3 py-2 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary">
            </div>

            <div class="pt-4 flex justify-end gap-3">
                <a href="{% url 'dashboard' %}" class="px-4 py-2 border dark:border-gray-600 rounded-md font-medium text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700">
                    Cancelar
                </a>
                <button type="submit" class="bg-primary text-white px-4 py-2 rounded-md font-medium hover:bg-primary_hover transition-colors">
                    Criar Usuário
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

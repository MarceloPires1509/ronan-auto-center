{% extends 'base.html' %}

{% block header_title %}Novo Serviço{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center gap-4">
        <a href="{% url 'lista_servicos' %}" class="text-gray-500 hover:text-gray-900">
            &larr; Voltar
        </a>
        <h1 class="text-2xl font-bold text-gray-900">Novo Serviço / Mão de Obra</h1>
    </div>

    <div class="bg-white rounded-lg border shadow-sm p-6">
        <form method="POST" action="{% url 'novo_servico' %}" class="space-y-4">
            {% csrf_token %}
            <div class="space-y-2">
                <label for="nome" class="text-sm font-medium">Nome do Serviço <span class="text-red-500">*</span></label>
                <input type="text" id="nome" name="nome" required class="w-full px-3 py-2 border rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>
            
            <div class="space-y-2">
                <label for="descricao" class="text-sm font-medium">Descrição (O que inclui o serviço)</label>
                <input type="text" id="descricao" name="descricao" class="w-full px-3 py-2 border rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label for="custo_mecanico" class="text-sm font-medium">Custo do Mecânico (R$)</label>
                    <input type="text" id="custo_mecanico" name="custo_mecanico" placeholder="0.00" class="w-full px-3 py-2 border rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
                <div class="space-y-2">
                    <label for="preco_venda" class="text-sm font-medium">Preço Cobrado do Cliente (R$)</label>
                    <input type="text" id="preco_venda" name="preco_venda" placeholder="0.00" class="w-full px-3 py-2 border rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
            </div>

            <div class="pt-4 flex justify-end gap-3">
                <a href="{% url 'lista_servicos' %}" class="px-4 py-2 border rounded-md font-medium text-gray-500 hover:bg-gray-50">
                    Cancelar
                </a>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md font-medium hover:bg-blue-700 transition-colors">
                    Salvar Serviço
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block header_title %}{% if cliente %}Editar Cliente{% else %}Novo Cliente{% endif %}{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div class="flex items-center gap-4">
        <a href="{% url 'lista_clientes' %}" class="text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">
            &larr; Voltar
        </a>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">{% if cliente %}Editar Cliente{% else %}Novo Cliente{% endif %}</h1>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-lg border dark:border-gray-700 shadow-sm p-6">
        <form method="POST" action="" class="space-y-6">
            {% csrf_token %}
            
            <h2 class="text-lg font-bold text-gray-900 dark:text-white border-b pb-2 dark:border-gray-700">Dados Pessoais</h2>
            
            <div class="space-y-4">
                <div class="space-y-2">
                    <label for="nome" class="text-sm font-medium text-gray-700 dark:text-gray-300">Nome Completo <span class="text-red-500">*</span></label>
                    <input type="text" id="nome" name="nome" value="{{ cliente.nome|default:'' }}" required class="w-full px-3 py-2 border rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label for="telefone" class="text-sm font-medium text-gray-700 dark:text-gray-300">Telefone</label>
                        <input type="text" id="telefone" name="telefone" value="{{ cliente.telefone|default:'' }}" class="w-full px-3 py-2 border rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                    <div class="space-y-2">
                        <label for="email" class="text-sm font-medium text-gray-700 dark:text-gray-300">E-mail</label>
                        <input type="email" id="email" name="email" value="{{ cliente.email|default:'' }}" class="w-full px-3 py-2 border rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                </div>
            </div>

            <h2 class="text-lg font-bold text-gray-900 dark:text-white border-b pb-2 dark:border-gray-700 mt-8">Endereço</h2>
            
            <div class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                    <div class="space-y-2 sm:col-span-1">
                        <label for="cep" class="text-sm font-medium text-gray-700 dark:text-gray-300">CEP</label>
                        <input type="text" id="cep" name="cep" value="{{ cliente.cep|default:'' }}" onblur="buscarCep()" class="w-full px-3 py-2 border rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="Somente números">
                    </div>
                    <div class="space-y-2 sm:col-span-3">
                        <label for="endereco" class="text-sm font-medium text-gray-700 dark:text-gray-300">Logradouro (Rua)</label>
                        <input type="text" id="endereco" name="endereco" value="{{ cliente.endereco|default:'' }}" class="w-full px-3 py-2 border rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                    <div class="space-y-2 sm:col-span-1">
                        <label for="numero" class="text-sm font-medium text-gray-700 dark:text-gray-300">Número</label>
                        <input type="text" id="numero" name="numero" value="{{ cliente.numero|default:'' }}" class="w-full px-3 py-2 border rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                    <div class="space-y-2 sm:col-span-3">
                        <label for="complemento" class="text-sm font-medium text-gray-700 dark:text-gray-300">Complemento</label>
                        <input type="text" id="complemento" name="complemento" value="{{ cliente.complemento|default:'' }}" class="w-full px-3 py-2 border rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="space-y-2">
                        <label for="bairro" class="text-sm font-medium text-gray-700 dark:text-gray-300">Bairro</label>
                        <input type="text" id="bairro" name="bairro" value="{{ cliente.bairro|default:'' }}" class="w-full px-3 py-2 border rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                    <div class="space-y-2">
                        <label for="cidade" class="text-sm font-medium text-gray-700 dark:text-gray-300">Cidade</label>
                        <input type="text" id="cidade" name="cidade" value="{{ cliente.cidade|default:'' }}" class="w-full px-3 py-2 border rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                    <div class="space-y-2">
                        <label for="estado" class="text-sm font-medium text-gray-700 dark:text-gray-300">UF</label>
                        <input type="text" id="estado" name="estado" value="{{ cliente.estado|default:'' }}" class="w-full px-3 py-2 border rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600" maxlength="2">
                    </div>
                </div>
            </div>

            <h2 class="text-lg font-bold text-gray-900 dark:text-white border-b pb-2 dark:border-gray-700 mt-8">Veículo</h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label for="veiculo" class="text-sm font-medium text-gray-700 dark:text-gray-300">Veículo (Modelo/Ano)</label>
                    <input type="text" id="veiculo" name="veiculo" value="{{ cliente.veiculo|default:'' }}" class="w-full px-3 py-2 border rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
                <div class="space-y-2">
                    <label for="placa" class="text-sm font-medium text-gray-700 dark:text-gray-300">Placa</label>
                    <input type="text" id="placa" name="placa" value="{{ cliente.placa|default:'' }}" class="w-full px-3 py-2 border rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
            </div>

            <div class="pt-6 flex justify-end gap-3">
                <a href="{% url 'lista_clientes' %}" class="px-4 py-2 border rounded-md font-medium text-gray-500 hover:bg-gray-50 dark:hover:bg-gray-700 dark:text-gray-300">
                    Cancelar
                </a>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md font-medium hover:bg-blue-700 transition-colors">
                    Salvar Cliente
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function buscarCep() {
    var cep = document.getElementById('cep').value.replace(/\D/g, '');
    if (cep !== "" && cep.length === 8) {
        document.getElementById('endereco').value = "...";
        document.getElementById('bairro').value = "...";
        document.getElementById('cidade').value = "...";
        document.getElementById('estado').value = "...";
        
        fetch('https://viacep.com.br/ws/' + cep + '/json/')
            .then(response => response.json())
            .then(data => {
                if (!data.erro) {
                    document.getElementById('endereco').value = data.logradouro;
                    document.getElementById('bairro').value = data.bairro;
                    document.getElementById('cidade').value = data.localidade;
                    document.getElementById('estado').value = data.uf;
                    document.getElementById('numero').focus();
                } else {
                    alert("CEP não encontrado.");
                    limparCamposCep();
                }
            })
            .catch(error => {
                console.error("Erro ao buscar CEP:", error);
                limparCamposCep();
            });
    }
}
function limparCamposCep() {
    document.getElementById('endereco').value = "";
    document.getElementById('bairro').value = "";
    document.getElementById('cidade').value = "";
    document.getElementById('estado').value = "";
}
</script>
{% endblock %}

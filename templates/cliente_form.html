{% extends 'base.html' %}

{% block header_title %}Novo Cliente{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center gap-4">
        <a href="{% url 'lista_clientes' %}" class="text-gray-500 hover:text-gray-900">
            &larr; Voltar
        </a>
        <h1 class="text-2xl font-bold text-gray-900">Novo Cliente</h1>
    </div>

    <div class="bg-white rounded-lg border shadow-sm p-6">
        <form method="POST" action="{% url 'novo_cliente' %}" class="space-y-4">
            {% csrf_token %}
            <div class="space-y-2">
                <label for="nome" class="text-sm font-medium">Nome Completo <span class="text-red-500">*</span></label>
                <input type="text" id="nome" name="nome" required class="w-full px-3 py-2 border rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label for="telefone" class="text-sm font-medium">Telefone</label>
                    <input type="text" id="telefone" name="telefone" class="w-full px-3 py-2 border rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
                <div class="space-y-2">
                    <label for="email" class="text-sm font-medium">E-mail</label>
                    <input type="email" id="email" name="email" class="w-full px-3 py-2 border rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label for="veiculo" class="text-sm font-medium">Veículo (Modelo/Ano)</label>
                    <input type="text" id="veiculo" name="veiculo" class="w-full px-3 py-2 border rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
                <div class="space-y-2">
                    <label for="placa" class="text-sm font-medium">Placa</label>
                    <input type="text" id="placa" name="placa" class="w-full px-3 py-2 border rounded-md bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
            </div>

            <div class="pt-4 flex justify-end gap-3">
                <a href="{% url 'lista_clientes' %}" class="px-4 py-2 border rounded-md font-medium text-gray-500 hover:bg-gray-50">
                    Cancelar
                </a>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md font-medium hover:bg-blue-700 transition-colors">
                    Salvar Cliente
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

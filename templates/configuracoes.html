{% extends 'base.html' %}

{% block header_title %}Configurações do Sistema{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto space-y-6">
    <div class="max-w-2xl mx-auto">
        
        <!-- Configurações Gerais da Loja -->
        <div class="bg-white dark:bg-gray-800 rounded-lg border dark:border-gray-700 shadow-sm p-6">
            <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-4">Dados da Empresa</h2>
            <form method="POST" enctype="multipart/form-data" class="space-y-4">
                {% csrf_token %}
                <input type="hidden" name="salvar_dados" value="1">
                
                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Nome da Loja</label>
                    <input type="text" name="nome_loja" value="{{ config.nome_loja }}" required class="w-full px-3 py-2 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Telefone para Contato</label>
                    <input type="text" name="telefone" id="telefone" value="{{ config.telefone|default:'' }}" class="w-full px-3 py-2 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Endereço Completo</label>
                    <textarea name="endereco_completo" rows="3" class="w-full px-3 py-2 border dark:border-gray-600 rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none">{{ config.endereco_completo|default:'' }}</textarea>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Logo (Usada na impressão)</label>
                    {% if config.logo %}
                        <div class="mb-2"><img src="{{ config.logo.url }}" class="h-16 object-contain bg-gray-100 p-2 rounded"></div>
                    {% endif %}
                    <input type="file" name="logo" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>

                <button type="submit" class="bg-primary text-white px-4 py-2 rounded-md font-medium hover:bg-primary_hover transition-colors w-full">
                    Salvar Dados da Empresa
                </button>
            </form>
        </div>

    </div>
</div>
{% endblock %}
